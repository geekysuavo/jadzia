[project]
name = "jadzia"
version = "0.1.0"
description = "A symbiosis of Pydantic and JAX"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.5.0",
    "equinox>=0.13.8",
    "grain>=0.2.18",
    "jax>=0.11.1; sys_platform == 'darwin'",
    "jax[cuda13]>=0.11.1; sys_platform != 'darwin'",
    "lmdb>=2.3.0",
    "mpi4py>=4.1.2",
    "msgpack>=1.2.2",
    "numpy>=2.5.2",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.4",
    "polars>=1.44.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
doc = [
    "mkdocs>=1.6.1",
    "mkdocs-autoapi>=0.4.1",
    "mkdocs-gitbook>=0.0.1",
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.7",
    "pymdown-extensions>=11.0.2",
    "ruff>=0.16.5",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "A",    # flake8-builtins
    "C",    # complexity
    "D",    # pydocstyle
    "E",    # pycodestyle-error
    "F",    # pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "NPY",  # numpy
    "PT",   # pytest
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RUF",  # ruff-specific
    "W",    # pycodestyle-warning
]
extend-ignore = [
    "D203",  # incorrect-blank-line-before-class
    "D212",  # multi-line-summary-first-line
]

[tool.ruff.lint.isort.import-heading]
future = "Future"
standard-library = "Standard"
third-party = "Third party"
first-party = "Dax"

[tool.ruff.lint.per-file-ignores]
"test/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
