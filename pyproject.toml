[project]
name = "jadzia"
version = "0.1.0"
description = "A symbiosis of Pydantic and JAX"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.4.4",
    "polars>=1.40.1",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "A",    # flake8-builtins
    "C",    # complexity
    "COM",  # flake8-commas
    "D",    # pydocstyle
    "E",    # pycodestyle-error
    "F",    # pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "NPY",  # numpy
    "PT",   # pytest
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RUF",  # ruff-specific
    "W",    # pycodestyle-warning
]
extend-ignore = [
    "D203",  # incorrect-blank-line-before-class
    "D212",  # multi-line-summary-first-line
]

[tool.ruff.lint.isort.import-heading]
future = "Future"
standard-library = "Standard"
third-party = "Third party"
first-party = "Dax"

[tool.ruff.lint.per-file-ignores]
"test/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
